services:
  app:
    build: .
    image: travel-booking:1.0.0
    ports: ["3000:3000"]
    environment: { APP_VERSION: "1.0.0", LOG_LEVEL: info }
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [app]
  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment: { GF_SECURITY_ADMIN_PASSWORD: admin }
    volumes: ["./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]
