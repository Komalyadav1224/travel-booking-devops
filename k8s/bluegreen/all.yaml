apiVersion: v1
kind: Namespace
metadata: { name: travel-bg }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: travel-blue, namespace: travel-bg }
spec:
  replicas: 2
  selector: { matchLabels: { app: travel-booking, version: blue } }
  template:
    metadata:
      labels: { app: travel-booking, version: blue }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: app
          image: travel-booking:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: APP_VERSION, value: "1.0.0" }
            - { name: APP_COLOR, value: blue }
          readinessProbe: { httpGet: { path: /ready, port: 3000 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: travel-green, namespace: travel-bg }
spec:
  replicas: 0
  selector: { matchLabels: { app: travel-booking, version: green } }
  template:
    metadata:
      labels: { app: travel-booking, version: green }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: app
          image: travel-booking:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: APP_VERSION, value: "1.0.0" }
            - { name: APP_COLOR, value: green }
          readinessProbe: { httpGet: { path: /ready, port: 3000 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata: { name: travel-booking, namespace: travel-bg }
spec:
  type: NodePort
  selector: { app: travel-booking, version: blue }   # <- switch blue/green here
  ports: [{ port: 80, targetPort: 3000, nodePort: 30081 }]
