apiVersion: v1
kind: Namespace
metadata: { name: travel-rolling }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: travel-booking, namespace: travel-rolling }
spec:
  replicas: 3
  selector: { matchLabels: { app: travel-booking } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: travel-booking }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: app
          image: travel-booking:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env: [{ name: APP_VERSION, value: "1.0.0" }]
          readinessProbe: { httpGet: { path: /ready, port: 3000 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata: { name: travel-booking, namespace: travel-rolling }
spec:
  type: NodePort
  selector: { app: travel-booking }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30080 }]
