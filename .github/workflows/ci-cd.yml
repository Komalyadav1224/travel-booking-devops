name: CI-CD
on:
  push: { branches: [main] }
  pull_request:
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npm audit --omit=dev --audit-level=high
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, severity: 'HIGH,CRITICAL', exit-code: '1' }
  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t $IMAGE:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@master
        with: { image-ref: '${{ env.IMAGE }}:${{ github.sha }}', severity: 'CRITICAL', exit-code: '1' }
      - if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE:${{ github.sha }}
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube && echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Blue-Green deploy
        run: scripts/deploy-bluegreen.sh ghcr.io/${{ github.repository }}:${{ github.sha }}
